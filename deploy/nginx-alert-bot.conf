# nginx site for the bot, used on the ECS server where nginx already owns port 443.
# Copy to the nginx conf directory (e.g. /etc/nginx/conf.d/alert-bot.conf), then: nginx -t && systemctl reload nginx
# Certificate files come from certbot (deploy/certs/README.md). The bot container publishes 127.0.0.1:8080.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alert-bot.mybot.ink;

    ssl_certificate     /root/alert-ir-bot/deploy/certs/live/alert-bot.mybot.ink/fullchain.pem;
    ssl_certificate_key /root/alert-ir-bot/deploy/certs/live/alert-bot.mybot.ink/privkey.pem;

    # who really called (Lark / Zoho source IPs); the bot only sees 127.0.0.1
    access_log /var/log/nginx/alert-bot.access.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
