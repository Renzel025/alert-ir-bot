# On the ECS server:  docker compose up -d --build
services:
  bot:
    build: .
    container_name: alert-ir-bot
    restart: unless-stopped
    env_file: .env                     # DRY_RUN=0, real credentials
    environment:
      DATABASE_PATH: /data/alert_ir.sqlite3
      POLICY_PATH: /data/policy.yaml
      TZ: ${TZ:-Asia/Manila}            # card history times ("Triggered 17:23"); containers default to UTC
    volumes:
      - ./data:/data                   # sqlite + policy.yaml survive rebuilds; edit data/policy.yaml live
    ports:
      - "127.0.0.1:8080:8080"          # only Caddy talks to it; not exposed to the internet directly

  # HTTPS for Lark's event callback + Zoho's webhook. On the ECS server the host's existing nginx owns
  # 443 and proxies alert-bot.<domain> to 127.0.0.1:8080 (see deploy/nginx-alert-bot.conf), so Caddy is
  # OFF by default. Only on a server with no web server on 443: `docker compose --profile caddy up -d`.
  # Certificate: Let's Encrypt via manual DNS challenge, deploy/certs/README.md.
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    container_name: alert-ir-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro         # certbot output (live/<host>/fullchain.pem + privkey.pem)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
