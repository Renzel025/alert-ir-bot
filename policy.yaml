# Alert policy (temporary home; moves to Lark Base later).
# Lookup order: defaults -> first matching rule (by rule name) -> severity_overrides -> severity_always_page (hard floor).
#
# Two clocks, both counted from the moment the alert arrived:
#   wait_minutes    nobody acknowledged within N min -> page.  0 = no such deadline (normal thresholds)
#   firing_minutes  still open N min after the alert started, acknowledged or not -> page
# "normal" from the tagged check person resolves at any time; "acknowledge" posts the incident card.

defaults:
  always_page: false
  check_person: ""            # Lark open_id (ou_...) of the person to tag when the AI says "can wait"
  check_person_name: ""       # display name for the @mention
  wait_minutes: 0             # normal threshold: no must-acknowledge deadline
  firing_minutes: 20          # ...but firing for 20 min -> page

# Severities that always page, whatever the rule says.
severity_always_page: ["P0", "critical"]

# Per-severity deadlines, applied after the name rules. Keys are matched case-insensitively.
severity_overrides:
  P1:      {wait_minutes: 5}  # high threshold: no acknowledgement within 5 min -> page
  high:    {wait_minutes: 5}
  error:   {wait_minutes: 5}

# First match wins. `match` is a case-insensitive regex on the rule name.
rules:
  - match: "^test-automation:"     # a failed Web/PC test run (one rule per provider); HIGH → 5 min to acknowledge (severity_overrides)
    firing_minutes: 20
  - match: "payment|deposit|withdraw|login"
    always_page: true
  - match: "provider.*drop"
    check_person: ""          # ou_...
    check_person_name: ""
    firing_minutes: 30
